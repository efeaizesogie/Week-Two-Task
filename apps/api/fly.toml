app = "rfpilot-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["api"]

[[services]]
  internal_port = 4000
  protocol = "tcp"

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[processes]
  api = "node dist/main.js"
  worker = "node dist/worker.js"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
